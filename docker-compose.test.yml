services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: guvende_test
      POSTGRES_USER: guvende_test_user
      POSTGRES_PASSWORD: local-test-only-password
    ports:
      - "127.0.0.1:5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guvende_test_user -d guvende_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: "no"
